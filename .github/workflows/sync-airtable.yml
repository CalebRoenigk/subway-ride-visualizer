name: Sync Airtable Rides

on:
  schedule:
    - cron: '0 11 * * *' # ~6-7am America/New_York depending on DST
  workflow_dispatch:

permissions:
  contents: write
  actions: write # needed to explicitly dispatch deploy.yml below

concurrency:
  group: sync-airtable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync new rides from Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: node scripts/sync-airtable.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/rides.csv scripts/airtable-sync-state.json
            git commit -m "Sync rides from Airtable"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # Commits made with the default GITHUB_TOKEN don't trigger other
      # workflows' `on: push` (an anti-recursion safeguard), so deploy.yml
      # would otherwise never run for this push. Trigger it explicitly so a
      # real `npm run build` always follows a sync that changes rides.csv.
      #
      # Observed in practice: deploy.yml's deploy-pages step can fail (e.g.
      # a "Timeout reached, aborting!" from GitHub's Pages backend) or the
      # live page can otherwise lag behind, leaving the site serving a
      # stale but still-built prior version. Checking only for "not raw
      # source" doesn't catch that. deploy.yml stamps dist/index.html with
      # the commit SHA it was built from, so verify against that exact SHA
      # and keep re-triggering until the live page actually reflects this
      # commit.
      - name: Trigger deploy and verify it goes live
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          gh workflow run deploy.yml --ref main
          for attempt in 1 2 3 4 5; do
            sleep 45
            if curl -s "https://calebroenigk.github.io/subway-ride-visualizer/?cachebust=$(date +%s%N)" | grep -q "build-sha\" content=\"$SHA\""; then
              echo "Attempt $attempt: site verified live with commit $SHA."
              exit 0
            else
              echo "Attempt $attempt: site not yet serving commit $SHA, re-triggering deploy."
              gh workflow run deploy.yml --ref main
            fi
          done
          echo "::error::Site never reflected commit $SHA after retries — deploy-pages may be failing (check the Actions tab), needs manual investigation."
          exit 1
