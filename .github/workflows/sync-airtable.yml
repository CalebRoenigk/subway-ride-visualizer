name: Sync Airtable Rides

on:
  schedule:
    - cron: '0 11 * * *' # ~6-7am America/New_York depending on DST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-airtable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync new rides from Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: node scripts/sync-airtable.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/rides.csv scripts/airtable-sync-state.json
            git commit -m "Sync rides from Airtable"
            git push
          else
            echo "No changes to commit."
          fi
